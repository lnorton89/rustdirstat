# cargo-deny configuration. Run `cargo install cargo-deny && cargo deny
# check` locally, or wire it into CI once the initial run is clean — the
# point is that a bad advisory or a surprising license shows up as a
# reviewable event, not a release-day surprise.

[advisories]
# Nightly advisory DB is fine for a utility; the lockfile is checked
# against it and a new advisory becomes a CI failure rather than a
# silently-ignored footnote.
yanked = "warn"

# Four advisories with no practical fix, all in the egui 0.29 stack this
# crate holds at deliberately (see CLAUDE.md):
#
# - RUSTSEC-2026-0192: ttf-parser is unmaintained, no successor release
#   (upstream points at skrifa); drawn in by ab_glyph for font shaping.
#   Input is the OS's own fonts, not untrusted data.
# - RUSTSEC-2024-0436: paste is unmaintained, no fix; a trivial macro
#   crate in accesskit_winit and metal.
# - RUSTSEC-2026-0194/0195: quick-xml vulnerabilities in the Linux
#   accessibility stack (zbus_xml via atspi). The fixed quick-xml is a
#   breaking release, so clearing them means bumping the accesskit stack
#   — the egui upgrade this repo is deliberately not doing yet.
#
# Revisit all four when egui 0.29 is left behind.
ignore = [
    "RUSTSEC-2026-0192",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]

[licenses]
# MIT-led, but the GUI's font and platform stack brings in a few more
# permissive licenses: BSL-1.0 (error-code), MPL-2.0 (option-ext), and
# OFL-1.1 + the Ubuntu Font Licence for egui's bundled fonts. Anything
# new must prove itself rather than being assumed fine.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "0BSD",
    "Unlicense",
    "BSL-1.0",
    "MPL-2.0",
    "OFL-1.1",
    "LicenseRef-UFL-1.0",
]

[bans]
multiple-versions = "warn"

[sources]
# No git-dependency surprise: everything comes from crates.io or the
# standard vendored sources.
unknown-registry = "deny"
unknown-git = "deny"
