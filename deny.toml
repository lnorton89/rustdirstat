# cargo-deny configuration. Enforced in CI by the `deny` job in
# .github/workflows/ci.yml; `cargo install cargo-deny && cargo deny check
# --all-features` locally gives the same answer before you push. The point
# is that a bad advisory or a surprising license shows up as a reviewable
# event, not a release-day surprise.
#
# Dependabot is the other half of this: .github/dependabot.yml opens the
# version-update PRs, and the `deny` job runs against each one.

[advisories]
# Nightly advisory DB is fine for a utility; the lockfile is checked
# against it and a new advisory becomes a CI failure rather than a
# silently-ignored footnote.
yanked = "warn"

# One advisory left, and it is an unmaintained-crate notice rather than a
# vulnerability:
#
# - RUSTSEC-2026-0192: ttf-parser is unmaintained, no successor release
#   (upstream points at skrifa); drawn in by ab_glyph for font shaping.
#   Input is the OS's own fonts, not untrusted data.
#
# The other three ignores this file used to carry were all consequences
# of holding the egui stack at 0.29, and the 0.36 upgrade cleared them:
# RUSTSEC-2024-0436 (paste, unmaintained) is no longer in the graph, and
# RUSTSEC-2026-0194/0195 (quick-xml, reached through zbus_xml via atspi)
# went with the accesskit bump that came along with egui. That is what
# the upgrade was for — do not re-add an ignore without saying why the
# advisory cannot be fixed instead.
ignore = ["RUSTSEC-2026-0192"]

[licenses]
# MIT-led, but the GUI's font and platform stack brings in a few more
# permissive licenses: BSL-1.0 (error-code), MPL-2.0 (option-ext), and
# OFL-1.1 + the Ubuntu Font Licence for egui's bundled fonts. Anything
# new must prove itself rather than being assumed fine.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "0BSD",
    "Unlicense",
    "BSL-1.0",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

[bans]
multiple-versions = "warn"

[sources]
# No git-dependency surprise: everything comes from crates.io or the
# standard vendored sources.
unknown-registry = "deny"
unknown-git = "deny"
