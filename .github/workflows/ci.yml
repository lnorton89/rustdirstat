name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run's result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      # Pinned to full SHAs: a mutable tag in a workflow is a supply-chain
      # risk the moment the workflow holds a write-capable token. Update
      # deliberately, with a `--checkout <sha>` diff, not silently on the
      # next run. The versions are in the comments.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No version here: rust-toolchain.toml pins it, so CI and a local
      # checkout run the same rustfmt and the same clippy. `@stable`
      # meant CI silently moved to each new release on its own.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, 2026-08
        with:
          toolchain: "1.98.0"
          components: rustfmt
      - run: cargo fmt --all -- --check

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    # The dependency surface is the same for every platform, so one run
    # suffices. Reads only — the `cargo-deny` action downloads the
    # advisory database and scans the lockfile.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Runs `cargo deny check` with `deny.toml` in the repo root. The
      # four ignored advisories and their justification live in that
      # file; anything new fails here.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide the state of the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      # fetch-depth: 0 for the changelog check below, which reads `git tag`
      # and walks the whole history. The default checkout is shallow and
      # fetches no tags at all, so every release would come back missing —
      # the check would fail for a reason that has nothing to do with the
      # changelog. 119 commits; the extra fetch is not measurable.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, 2026-08
        with:
          toolchain: "1.98.0"
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.os }}

      # The desktop GUI pulls in winit/wgpu and rfd. rfd here goes through
      # the XDG portal rather than GTK, so this is the windowing and
      # keyboard stack only -- no libgtk needed.
      - name: Install Linux windowing dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev

      # The crate denies unwrap/expect/panic in shipping code; test code is
      # exempted by a cfg_attr in lib.rs, so every target can be linted.
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

      # CHANGELOG.md is generated from the git history by
      # `examples/changelog.rs`, so a released section that disagrees with
      # the tags is a mistake, not a style choice. Released sections only:
      # the `Unreleased` section moves with every merge, and a squash or
      # rebase rewrites the very hashes it pins, so gating pull requests on
      # it would fail all of them for no signal. One platform is enough —
      # git history does not vary by OS — and the build is already warm
      # from the two steps above.
      - name: Changelog
        if: runner.os == 'Linux'
        run: cargo run --example changelog -- --check

      # tests/quit_stress.rs drives the real binary inside a pty and is
      # cfg(unix), so it compiles to nothing on Windows. Building the
      # binaries in release is what catches anything that only shows up
      # with LTO and optimizations on.
      - name: Build release binaries
        run: cargo build --release --bins

      # Packaging is the part of a release that nothing else exercises,
      # and a broken packaging step is only discovered while cutting the
      # release it breaks. Both packages are built here from the release
      # binaries above — the same versions the release workflow pins —
      # and thrown away; nothing is uploaded. Linux only, because that is
      # where both formats are built for real.
      - name: Package (dry run)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cargo install cargo-deb --version 3.7.0 --locked
          cargo install cargo-generate-rpm --version 0.16.1 --locked
          cargo deb --no-build --no-strip --output /tmp/ci-check.deb
          cargo generate-rpm --output /tmp/ci-check.rpm
          ls -l /tmp/ci-check.deb /tmp/ci-check.rpm
