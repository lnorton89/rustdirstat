name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run's result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Kept equal to rust-toolchain.toml's channel. The file is what rustup
  # actually obeys; this is here so the action installs that toolchain up
  # front rather than downloading it on the first cargo call.
  TOOLCHAIN: "1.98.0"

jobs:
  format:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No version here: rust-toolchain.toml pins it, so CI and a local
      # checkout run the same rustfmt and the same clippy. `@stable`
      # meant CI silently moved to each new release on its own.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide the state of the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.TOOLCHAIN }}
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # The desktop GUI pulls in winit/wgpu and rfd. rfd here goes through
      # the XDG portal rather than GTK, so this is the windowing and
      # keyboard stack only -- no libgtk needed.
      - name: Install Linux windowing dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev

      # The crate denies unwrap/expect/panic in shipping code; test code is
      # exempted by a cfg_attr in lib.rs, so every target can be linted.
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

      # tests/quit_stress.rs drives the real binary inside a pty and is
      # cfg(unix), so it compiles to nothing on Windows. Building the
      # binaries in release is what catches anything that only shows up
      # with LTO and optimizations on.
      - name: Build release binaries
        run: cargo build --release --bins
