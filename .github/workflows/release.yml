name: Release

# Tagging is the trigger: `git tag v0.2.0 && git push origin v0.2.0`.
# The release is created as a draft, the per-platform archives are
# attached to it, and it is only published once every platform has
# succeeded -- so a failed build leaves an unpublished draft rather than a
# half-populated public release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build a release from (e.g. v0.2.0)"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  draft:
    name: Create draft release
    runs-on: ubuntu-latest
    # This job and `publish` are the only ones that hold a write-capable
    # token; the build matrix below runs third-party code and needs none.
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve tag
        id: resolve
        shell: bash
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, reusing it."
          else
            gh release create "$TAG" \
              --draft \
              --title "rustdirstat $TAG" \
              --generate-notes
          fi

  build:
    name: ${{ matrix.target }}
    needs: draft
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          # Both macOS targets are built on the Apple Silicon runner, the
          # Intel one by cross-compiling. The Intel `macos-13` image is
          # being retired and its queue can now sit for the better part of
          # an hour or never schedule at all, which is enough on its own
          # to hold up a release; the Xcode toolchain ships both slices,
          # so there is nothing to gain by waiting for it.
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
    steps:
      # Pinned to full SHAs, as in ci.yml — a mutable action tag inside a
      # workflow that once held a release-writing token is exactly the
      # blast radius this pins away.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.draft.outputs.tag }}

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, 2026-08
        with:
          toolchain: "1.98.0"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.target }}

      - name: Install Linux windowing dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev

      - name: Build
        run: cargo build --release --bins --target ${{ matrix.target }}

      # Both binaries ship together: the TUI/report tool and the desktop
      # GUI are two front ends over one scanner, and someone who wants one
      # usually wants the other available.
      - name: Package
        shell: bash
        env:
          TAG: ${{ needs.draft.outputs.tag }}
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          name="rustdirstat-${TAG}-${TARGET}"
          staging="dist/${name}"
          mkdir -p "$staging"

          bindir="target/${TARGET}/release"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "${bindir}/rustdirstat.exe" "${bindir}/rustdirstat-gui.exe" "$staging/"
          else
            cp "${bindir}/rustdirstat" "${bindir}/rustdirstat-gui" "$staging/"
          fi
          cp README.md LICENSE "$staging/"

          cd dist
          if [ "$ARCHIVE" = "zip" ]; then
            7z a -tzip "${name}.zip" "$name" >/dev/null
          else
            tar czf "${name}.tar.gz" "$name"
          fi

          asset="${name}.${ARCHIVE}"
          # Checksums travel with the archive so a download can be verified
          # without trusting the transfer.
          if command -v sha256sum >/dev/null; then
            sha256sum "$asset" > "${asset}.sha256"
          else
            shasum -a 256 "$asset" > "${asset}.sha256"
          fi

      # Distribution beyond a raw tarball, from the one job whose
      # toolchain matches: a .deb for the Debian/Ubuntu family, and a
      # CycloneDX SBOM naming every crate in the build so a consumer can
      # audit what the binaries contain without trusting this workflow's
      # word for it.
      - name: Package .deb and SBOM
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        env:
          TAG: ${{ needs.draft.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # Exact versions, not "latest": `--locked` alone pins these
          # tools' *dependencies*, not the tools themselves, so a re-run
          # of this same workflow months later could package with a
          # different cargo-deb or emit a differently-shaped SBOM. A
          # version moves the way an action SHA does — deliberately, in
          # a reviewed commit.
          cargo install cargo-deb --version 3.7.0 --locked
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          deb="rustdirstat-${TAG}-amd64.deb"
          cargo deb --no-build --no-strip --target "$TARGET" --output "dist/${deb}"
          cargo cyclonedx --format json
          cp rustdirstat.cdx.json "dist/rustdirstat-${TAG}-sbom.cdx.json"
          cd dist
          sha256sum "$deb" > "${deb}.sha256"

      # One artifact per target: with upload-artifact@v4 a second matrix
      # job uploading to the same name fails outright, and even when it
      # didn't, a shared name is how one platform's files get mixed into
      # another's release. The name is what makes the glob below stay
      # distinct, and only the finished archives, packages, checksums,
      # and SBOM are uploaded — the staging directory with the raw
      # binaries, README, and LICENSE stays inside the build job where
      # it belongs.
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.deb
            dist/*.cdx.json
            dist/*.sha256

  publish:
    name: Publish release
    needs: [draft, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For the provenance attestation below — the OIDC token that
      # proves which workflow, at which commit, produced these bytes.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # `pattern`, not `name`: `name` is an exact artifact name with
          # no glob semantics, so `name: release-assets-*` would look for
          # an artifact literally called that and fail the job.
          pattern: release-assets-*
          path: dist
          merge-multiple: true
      # Signed build provenance for the archives, the .deb, and the
      # SBOM file — exactly those; the `.sha256` companions are not
      # attested, because an attestation *is* a signed digest and a
      # signed checksum-of-a-checksum adds nothing. Verifiable with
      # `gh attestation verify <file> -R <owner>/<repo>`. This is the
      # supply-chain half a project without paid signing certificates
      # can still provide; Authenticode and notarization need
      # credentials that live outside the repository.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.deb
            dist/*.cdx.json
      # And the SBOM again as a real SBOM attestation, so the CycloneDX
      # document is cryptographically bound to the artifacts it
      # describes rather than merely uploaded beside them —
      # `gh attestation verify <artifact> -R <owner>/<repo>
      #  --predicate-type https://cyclonedx.org/bom` retrieves it.
      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.deb
          sbom-path: dist/rustdirstat-${{ needs.draft.outputs.tag }}-sbom.cdx.json
      - name: Upload and undraft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: |
          cd dist
          gh release upload "$TAG" $(find . -type f) --clobber
          gh release edit "$TAG" --draft=false --latest
