version: 2
updates:
  # Crate updates as reviewable PRs rather than the toolchain drifting on
  # its own. Grouped by minor so the GUI's large dependency tree does not
  # arrive as an unreadable wall of unrelated bumps.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # Actions are pinned to full commit SHAs (see .github/workflows), so a
  # Dependabot PR is the deliberate, diff-visible way a pin moves.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
