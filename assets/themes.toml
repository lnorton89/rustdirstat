# Authentic high contrast is black everywhere, with borders doing all the
# separating. The layers still step, minimally, so a surface can be told
# from the one behind it even where no border is drawn between them.
[[theme]]
id = "high-contrast-dark"
name = "High Contrast Dark"
mode = "dark"
app = "#000000"
panel = "#0a0a0a"
raised = "#161616"
hover = "#262626"
border = "#6fc3df"
accent = "#6fc3df"
primary_text = "#ffffff"
secondary_text = "#d1d1d1"
danger = "#ff7676"
warning = "#f38518"
success = "#89d885"

