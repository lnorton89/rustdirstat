# The theme catalog.
#
# This file is compiled into the binary with `include_str!`, and any
# `*.toml` file dropped into `<config dir>/rustdirstat/themes/` is loaded
# on top of it at startup, so a theme can be added without rebuilding.
#
# Each theme states twelve colors and everything else is derived from
# them in `Palette::from_spec` — selection, muted accent fills, the
# danger callout background. That is deliberate: it is what stops a theme
# from shipping a selection color that clashes with its own accent.
#
# The four surface layers are named for depth, not for use. `app` is
# behind everything, `panel` sits on it, `raised` on that, and `hover` is
# the interactive lift above `raised`. In a dark theme that ramp gets
# lighter as it comes forward. In a light theme `hover` goes the other
# way, because a pale surface reads as lifted by getting *darker*.
#
# Every theme is checked by `theme_layers_are_distinct_and_copy_is_readable`:
# adjacent layers must differ enough to be told apart, and the two text
# weights and the accent must clear WCAG AA against the panel they sit on
# (7:1 for primary text, 4.5:1 for secondary and accent). A theme that
# fails is a failing build, not a subtly unreadable window.
#
# `id` is persisted in the config file. Never rename one — a rename
# silently drops everyone using it back to the default. The first entry
# is the default theme.

# ---------------------------------------------------------------- dark

[[theme]]
id = "dark-modern"
name = "Dark Modern"
mode = "dark"
app = "#181818"
panel = "#1f1f1f"
raised = "#2a2d2e"
hover = "#37393b"
border = "#3c3c3c"
accent = "#3c99e6"
primary_text = "#e0e0e0"
secondary_text = "#9d9d9d"
danger = "#f14c4c"
warning = "#cca700"
success = "#89d185"

