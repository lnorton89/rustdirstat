# Nederlands — volledige vertaling.
#
# Elke sleutel uit `en.toml` staat hier ook: een vertaling die met het
# programma wordt meegeleverd mag niet half af zijn, en de test
# `a_shipped_translation_is_complete` laat de build anders mislukken. De
# namen van de variabelen (`{files}`) horen bij het programma en blijven
# Engels; hun volgorde is wel vrij.

