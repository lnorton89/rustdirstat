"page.cleanups.how" = "Hoe ze werken"
"page.cleanups.how.body1" = "Elke opruimactie noemt een programma en zijn argumenten als een lijst. %p is het volledige pad, %n de naam, %d de map eromheen, en %% een letterlijk procentteken."
"page.cleanups.how.body2" = "Er komt geen shell aan te pas: argumenten worden doorgegeven zoals ze zijn, dus een bestandsnaam met spaties, aanhalingstekens of puntkomma's is gegeven en geen syntaxis. Opruimacties vragen vooraf, tenzij hun eigen regel anders zegt."

