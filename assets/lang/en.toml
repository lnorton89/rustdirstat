# The English message catalogue: the fallback for every other language,
# and the only one compiled into the binary.
#
# Keys are dotted paths naming *where* a string appears, never what it
# says — a key named after its English text has to change when the
# English does, and every translation then silently loses the entry.
# Placeholders are named (`{files}`), so a translation may reorder them.
#
# A translation is a copy of this file under `<config>/rustdirstat/lang/`,
# named for its language tag (`de.toml`, `fr.toml`). Missing keys fall
# back here, so a partial translation is a useful one.

