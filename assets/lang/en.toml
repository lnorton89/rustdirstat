# ----------------------------------------------------------- the terminal
#
# The window and the terminal share the catalogue but not the strings: the
# terminal names its own keys inside its text ("s sort, p size"), so a
# `tui.*` key is one only the terminal asks for.
#
# The confirmation buttons are the deliberate exception — `[ Y ]es` and
# `[ N ]o` are not routed through here, because the bracketed letter *is*
# the key the prompt accepts. Translating the label without translating
# the keyboard handler would advertise a key that does nothing.
