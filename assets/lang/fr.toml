"page.cleanups.how.body2" = "Aucun interpréteur n'intervient : les arguments sont transmis tels quels, un nom de fichier contenant des espaces, des guillemets ou des points-virgules est donc une donnée et non de la syntaxe. Les nettoyages demandent confirmation sauf mention contraire dans leur entrée."

