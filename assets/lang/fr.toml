# Français — traduction complète.
#
# Chaque clé de `en.toml` figure ici : une traduction livrée avec le
# programme ne doit pas être à moitié faite, et le test
# `a_shipped_translation_is_complete` fait échouer la compilation sinon.
# Les noms des variables (`{files}`) font partie du programme et restent
# en anglais ; leur ordre, lui, est libre.

