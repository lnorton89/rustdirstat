"page.cleanups.how" = "Nasıl çalışırlar"
"page.cleanups.how.body1" = "Her temizlik komutu bir programı ve argümanlarını bir liste olarak belirtir. %p tam yol, %n ad, %d içinde bulunduğu klasör, %% ise düz bir yüzde işaretidir."
"page.cleanups.how.body2" = "Araya hiçbir kabuk girmez: argümanlar oldukları gibi aktarılır, dolayısıyla boşluk, tırnak veya noktalı virgül içeren bir dosya adı sözdizimi değil veridir. Temizlik komutları, kendi girdileri aksini söylemedikçe çalışmadan önce sorar."

