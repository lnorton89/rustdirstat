# Čeština — úplný překlad.
#
# Každý klíč z `en.toml` je i zde: překlad dodávaný s programem nesmí
# zůstat rozdělaný a test `a_shipped_translation_is_complete` jinak
# nechá build spadnout. Názvy proměnných (`{files}`) jsou součástí
# programu a zůstávají anglicky; jejich pořadí je naopak volné.

