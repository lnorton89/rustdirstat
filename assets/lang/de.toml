# German catalogue — a partial translation, on purpose.
#
# It exists to prove the mechanism end to end: a real file, in the real
# format, with real coverage of the strings a user meets first. Every key
# it does not define falls back to English, which is what makes a partial
# translation useful rather than broken — and what lets a translator add
# ten lines and see them.
#
# Contributions welcome; copy assets/lang/en.toml, translate what you
# know, and drop it in <config>/rustdirstat/lang/<tag>.toml to try it.

