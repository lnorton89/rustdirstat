# Deutsch — die vollständige Übersetzung, und zugleich das Beispiel, an
# dem sich eine weitere orientieren kann.
#
# Jeder Schlüssel aus `en.toml` steht auch hier: eine ausgelieferte
# Übersetzung darf nicht halb fertig sein, und `a_shipped_translation_is_complete`
# lässt den Build sonst scheitern. Für eine *eigene* Übersetzung im
# Konfigurationsordner gilt das nicht — dort ist jeder fehlende Schlüssel
# einfach englisch.
#
# Die Platzhalter (`{files}`) tragen Namen und dürfen umgestellt werden;
# ihre Namen selbst sind Teil des Programms und bleiben englisch.

