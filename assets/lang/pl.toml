"page.cleanups.how" = "Jak działają"
"page.cleanups.how.body1" = "Każdy porządek wskazuje program i jego argumenty jako listę. %p to pełna ścieżka, %n nazwa, %d folder nadrzędny, a %% dosłowny znak procenta."
"page.cleanups.how.body2" = "Nie bierze w tym udziału żadna powłoka: argumenty są przekazywane takie, jakie są, więc nazwa pliku ze spacjami, cudzysłowami czy średnikami jest danymi, a nie składnią. Porządki pytają przed uruchomieniem, chyba że ich wpis mówi inaczej."

