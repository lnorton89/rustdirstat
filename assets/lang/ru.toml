"page.guide.extensions" = "Расширения"
"page.guide.extensions.body" = "Группирует файлы по точному расширению — с цветом, байтами, долей и количеством. Выбор строки подсвечивает соответствующие файлы на карте."
"page.guide.treemap.body" = "Каждый файл — площадь, пропорциональная его размеру. Площади каталогов вложены, плитки принимают цвет своего расширения, а щелчок по плитке выбирает соответствующий путь в дереве."
"page.guide.other_views" = "Остальные представления файлов"
"page.guide.other_views.body" = "Самые большие файлы — плоский список из 200 крупнейших. Дубликаты файлов группируют по хешу файлы, совпадающие байт в байт. Результаты поиска принимают шаблоны glob — * для любой последовательности символов, ? для одного, [a-z] для класса символов и {jpg,png} для вариантов — и регулярные выражения, если запрос начинается с re:."
"page.guide.footnote" = "Это повторяет три связанных представления WinDirStat: что выбрано в одном, выбрано во всех."
"page.cleanups.none" = "Команды очистки не настроены"
"page.cleanups.none.body" = "Команда очистки — это ваша собственная команда, применяемая к тому, что выбрано. Они живут в файле настроек; изначально нет ни одной."
"page.cleanups.yours" = "Ваши команды"
"page.cleanups.empty" = "Показывать нечего, пока их нет в файле настроек."
"page.cleanups.select_first" = "Сначала выберите элемент — команда очистки всегда действует на что-то одно."
"page.cleanups.how" = "Как они работают"
"page.cleanups.how.body1" = "Каждая команда очистки задаёт программу и её аргументы списком. %p — полный путь, %n — имя, %d — содержащая папка, а %% — буквальный знак процента."
"page.cleanups.how.body2" = "Никакая оболочка не участвует: аргументы передаются как есть, поэтому имя файла с пробелами, кавычками или точками с запятой — это данные, а не синтаксис. Команды очистки спрашивают перед запуском, если их запись не говорит иначе."

