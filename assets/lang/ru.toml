# Русский — полный перевод.
#
# Каждый ключ из `en.toml` есть и здесь: перевод, поставляемый вместе с
# программой, не может быть сделан наполовину, иначе тест
# `a_shipped_translation_is_complete` роняет сборку. Имена переменных
# (`{files}`) — часть программы и остаются английскими; их порядок,
# напротив, свободен.

