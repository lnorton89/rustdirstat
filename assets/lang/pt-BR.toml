# Todas as chaves de `en.toml` estão aqui: uma tradução distribuída com o
# programa não pode ficar pela metade, e o teste
# `a_shipped_translation_is_complete` faz a compilação falhar se ficar.
# Os nomes das variáveis (`{files}`) fazem parte do programa e continuam
# em inglês; a ordem delas, porém, é livre.

