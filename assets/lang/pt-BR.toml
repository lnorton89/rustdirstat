"page.cleanups.how" = "Como funcionam"
"page.cleanups.how.body1" = "Cada limpeza indica um programa e seus argumentos como uma lista. %p é o caminho completo, %n o nome, %d a pasta que o contém, e %% um sinal de porcentagem literal."
"page.cleanups.how.body2" = "Nenhum interpretador de comandos entra em jogo: os argumentos são passados como estão, então um nome de arquivo com espaços, aspas ou ponto e vírgula é dado, e não sintaxe. As limpezas perguntam antes de executar, a menos que a entrada delas diga o contrário."

