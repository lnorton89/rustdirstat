# Italiano — traduzione completa.
#
# Tutte le chiavi di `en.toml` sono presenti: una traduzione distribuita
# con il programma non deve restare a metà, e il test
# `a_shipped_translation_is_complete` fa fallire la compilazione se lo è.
# I nomi delle variabili (`{files}`) fanno parte del programma e restano
# in inglese; il loro ordine, invece, è libero.

