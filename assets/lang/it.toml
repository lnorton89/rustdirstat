"page.guide.all_files" = "L'albero delle cartelle espandibile, ordinato per dimensione. Selezionare un elemento lo inquadra nella mappa."
"page.guide.extensions" = "Estensioni"
"page.guide.extensions.body" = "Raggruppa i file per estensione esatta, con colore, byte, percentuale e conteggio. Selezionare una riga evidenzia i file corrispondenti nella mappa."
"page.guide.treemap.body" = "Ogni file è un'area proporzionale alla sua dimensione. Le aree delle cartelle si annidano, i riquadri prendono il colore della loro estensione, e facendo clic su uno si seleziona il percorso corrispondente nell'albero."
"page.guide.other_views" = "Le altre viste dei file"
"page.guide.other_views.body" = "File più grandi è un elenco piatto dei 200 maggiori. File duplicati raggruppa per impronta i file identici byte per byte. Risultati della ricerca accetta i modelli glob — * per qualsiasi sequenza di caratteri, ? per uno solo, [a-z] per una classe e {jpg,png} per le alternative — e le espressioni regolari quando la richiesta inizia con re:."
"page.guide.footnote" = "Questo riproduce le tre viste collegate di WinDirStat: ciò che è selezionato in una è selezionato in tutte."
"page.cleanups.none" = "Nessuna pulizia configurata"
"page.cleanups.none.body" = "Una pulizia è un comando tuo, applicato a ciò che è selezionato. Vivono nel file di configurazione; di serie non ce n'è nessuna."
"page.cleanups.yours" = "I tuoi comandi"
"page.cleanups.empty" = "Niente da mostrare finché il file di configurazione non ne contiene."
"page.cleanups.select_first" = "Seleziona prima un elemento — una pulizia agisce sempre su una cosa sola."
"page.cleanups.how" = "Come funzionano"
"page.cleanups.how.body1" = "Ogni pulizia indica un programma e i suoi argomenti come elenco. %p è il percorso completo, %n il nome, %d la cartella che lo contiene, e %% un segno di percentuale letterale."
"page.cleanups.how.body2" = "Non entra in gioco alcuna shell: gli argomenti vengono passati così come sono, quindi un nome di file con spazi, virgolette o punti e virgola è un dato e non sintassi. Le pulizie chiedono conferma prima di essere eseguite, salvo diversa indicazione nella loro voce."

