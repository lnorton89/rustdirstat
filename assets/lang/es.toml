# Español — traducción completa.
#
# Todas las claves de `en.toml` están aquí: una traducción que se
# distribuye con el programa no debe quedar a medias, y el test
# `a_shipped_translation_is_complete` hace fallar la compilación si lo
# está. Los nombres de las variables (`{files}`) son parte del programa y
# quedan en inglés; su orden, en cambio, es libre.

