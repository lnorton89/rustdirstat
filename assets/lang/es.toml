"page.cleanups.empty" = "Nada que mostrar mientras el archivo de configuración no tenga ninguna."
"page.cleanups.select_first" = "Seleccione primero un elemento — una limpieza siempre actúa sobre una sola cosa."
"page.cleanups.how" = "Cómo funcionan"
"page.cleanups.how.body1" = "Cada limpieza nombra un programa y sus argumentos como una lista. %p es la ruta completa, %n el nombre, %d la carpeta que lo contiene, y %% un signo de porcentaje literal."
"page.cleanups.how.body2" = "No interviene ningún intérprete de comandos: los argumentos se pasan tal cual, así que un nombre de archivo con espacios, comillas o puntos y coma es un dato y no sintaxis. Las limpiezas preguntan antes de ejecutarse salvo que su entrada diga lo contrario."

