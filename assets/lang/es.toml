"page.guide.other_views" = "Las demás vistas de archivos"
"page.guide.other_views.body" = "Archivos más grandes es una lista plana de los 200 mayores. Archivos duplicados agrupa por hash los archivos idénticos byte a byte. Resultados de búsqueda acepta patrones glob — * para cualquier secuencia de caracteres, ? para uno, [a-z] para una clase y {jpg,png} para alternativas — y expresiones regulares cuando la consulta empieza por re:."
