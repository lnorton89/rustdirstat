# Svenska — fullständig översättning.
#
# Varje nyckel ur `en.toml` finns även här: en översättning som följer
# med programmet får inte vara halvfärdig, och testet
# `a_shipped_translation_is_complete` fäller bygget annars. Variablernas
# namn (`{files}`) hör till programmet och står kvar på engelska; deras
# ordning är däremot fri.

