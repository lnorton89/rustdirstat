[package]
name = "rustdirstat"
version = "0.1.0"
edition = "2021"
description = "A cross-platform, terminal-based clone of WinDirStat for visualizing disk usage."
license = "MIT"
repository = "https://github.com/lnorton89/rustdirstat"

[[bin]]
name = "rustdirstat"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ratatui = "0.28"
crossterm = "0.28"
rayon = "1"
anyhow = "1"
trash = "5"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "5"
regex = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
