[package]
name = "rustdirstat"
version = "0.2.2"
edition = "2021"
description = "A cross-platform WinDirStat clone for visualizing disk usage, with both a native desktop GUI and a terminal UI."
license = "MIT"
repository = "https://github.com/lnorton89/rustdirstat"

[lib]
name = "rustdirstat"
path = "src/lib.rs"

[[bin]]
name = "rustdirstat"
path = "src/main.rs"

[[bin]]
name = "rustdirstat-gui"
path = "src/bin/gui.rs"

[dependencies]
# Keep both native renderers available, but run the app through wgpu. The
# default glow/glutin path rejects some valid Linux EGL/GLX setups (notably
# on NixOS) when they do not advertise its exact RGBA8 config template.
eframe = { version = "0.36", features = ["wgpu"] }
egui = "0.36"
egui_extras = "0.36"
rfd = "0.17"
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"
# use-dev-tty switches crossterm's Unix input backend from mio/epoll to a
# plain poll(2)-based one. This isn't about /dev/tty itself (both backends
# already fall back to stdin when it's a tty, which it always is for us) —
# it's about avoiding a real bug in the default mio backend: its read loop
# returns as soon as one event is parseable without draining the fd to
# EAGAIN, and mio registers fds edge-triggered, so any leftover unread
# bytes past that point never trigger another epoll wakeup. A burst of
# more than ~1024 bytes of input in one go (a terminal replaying buffered
# events after being left idle, or several thousand queued mouse events)
# reliably loses everything after the first batch — including a 'q' or
# Ctrl+C that arrived after it — hanging the app until new input arrives
# to create a fresh edge. Verified via tests/quit_stress.rs against a
# real pty. poll(2) is level-triggered, so it can't get stuck this way.
crossterm = { version = "0.29", features = ["use-dev-tty"] }
rayon = "1"
anyhow = "1"
trash = "5"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
dirs = "6"
regex = "1"
unicode-width = "0.2"

# Text-only clipboard. `default-features = false` drops `image-data`,
# which pulls the whole `image` crate to support copying bitmaps that
# nothing here copies.
arboard = { version = "3", default-features = false, features = [
    "wayland-data-control",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    # Shell file-type icons for the extension list.
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    # The seek-penalty (HDD vs SSD) query duplicate hashing sizes its
    # concurrency by. Win32_Security is not used directly — CreateFileW
    # takes a SECURITY_ATTRIBUTES pointer, and windows-sys hides the
    # function unless the parameter's feature is on.
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_Security",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# `cargo deb` (the release workflow's Linux packaging step) reads this.
# The assets are listed because cargo-deb's default includes only the
# binary named after the package — both front ends ship together, for
# the same reason the archives carry both. `target/release/...` paths
# are re-mapped automatically when building with `--target`.
[package.metadata.deb]
section = "utils"
priority = "optional"
assets = [
    ["target/release/rustdirstat", "usr/bin/", "755"],
    ["target/release/rustdirstat-gui", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/rustdirstat/README.md", "644"],
    ["LICENSE", "usr/share/doc/rustdirstat/LICENSE", "644"],
]

# Only the brand-asset generator needs these: `cargo run --example
# brand_assets` re-renders the PNGs in `assets/brand/` from `src/brand.rs`.
# Both are already in the tree as eframe dependencies, so this pulls
# nothing new down.
[target.'cfg(windows)'.build-dependencies]
# Embeds the application icon into the .exe. Without it Explorer, the
# taskbar and Task Manager show the generic blank-page icon — eframe's
# runtime window icon only covers the window itself.
winresource = "0.1"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
ab_glyph = "0.2"

[profile.release]
opt-level = 3
lto = true

[lints.rust]
warnings = "deny"
dead_code = "deny"
non_snake_case = "deny"
non_upper_case_globals = "deny"
non_camel_case_types = "deny"
unused_variables = "deny"
unused_imports = "forbid"
unused_must_use = "forbid"
unreachable_patterns = "forbid"
unreachable_pub = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
match_wild_err_arm = "deny"
rest_pat_in_fully_bound_structs = "deny"
ignored_unit_patterns = "deny"
allow_attributes = "deny"