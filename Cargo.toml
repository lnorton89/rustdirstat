[package]
name = "rustdirstat"
version = "0.1.0"
edition = "2021"
description = "A cross-platform, terminal-based clone of WinDirStat for visualizing disk usage."
license = "MIT"
repository = "https://github.com/lnorton89/rustdirstat"

[[bin]]
name = "rustdirstat"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ratatui = "0.28"
crossterm = "0.28"
rayon = "1"
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
